<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador Mercado Libre CO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f9;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form, table {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #007bff;
      color: white;
    }
    .viable { color: green; font-weight: bold; }
    .no-viable { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>📊 Simulador de Rentabilidad - Mercado Libre CO (versión realista)</h1>

  <form id="simulador">
    <label>Nombre del producto:</label>
    <input type="text" id="producto" required>

    <label>Costo unitario (COP):</label>
    <input type="number" id="costo" required>

    <label>Cantidad comprada:</label>
    <input type="number" id="cantidad" required>

    <label>Envío internacional total (COP):</label>
    <input type="number" id="envio" required>

    <label>Tipo de publicación y comisión (%):</label>
    <select id="publicacion">
      <optgroup label="Clásica">
        <option value="0.08">Clásica (8%)</option>
        <option value="0.10">Clásica (10%)</option>
        <option value="0.13" selected>Clásica (13%)</option>
        <option value="0.16">Clásica (16%)</option>
      </optgroup>
      <optgroup label="Premium">
        <option value="0.125">Premium (12.5%)</option>
        <option value="0.15">Premium (15%)</option>
        <option value="0.17">Premium (17%)</option>
        <option value="0.205">Premium (20.5%)</option>
      </optgroup>
    </select>

    <label>¿Precio incluye IVA?</label>
    <label><input type="checkbox" id="iva_included" checked> Sí (el precio que ingresa el cliente incluye IVA)</label>

    <label>Precio de venta (manual, COP):</label>
    <input type="number" id="precio">

    <hr style="margin:12px 0; border: none; height: 1px; background:#eee;">

    <label>Comisión Mercado Pago (%) (ej: 3.29):</label>
    <input type="number" id="mp_percent" value="3.29" step="0.01">

    <label>Comisión Mercado Pago fija (COP) (ej: 800):</label>
    <input type="number" id="mp_fixed" value="800" step="1">

    <label>Costo de envío local (si tú lo pagas) (COP):</label>
    <input type="number" id="shipping_local" value="0" step="1">

    <label><input type="checkbox" id="seller_pays_shipping"> El vendedor asume el envío (ofrezco envío gratis)</label>

    <button type="button" onclick="calcular()">Calcular</button>
  </form>

  <table id="resultado" style="display:none;">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Costo Unitario Real</th>
        <th>Precio Venta</th>
        <th>Comisión ML</th>
        <th>IVA Retenido</th>
        <th>Comisión MP (con IVA)</th>
        <th>Envío (si aplica)</th>
        <th>Ingreso Neto</th>
        <th>Margen Neto</th>
        <th>Resultado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button onclick="imprimir()" style="display:none;" id="btnPrint">🖨️ Imprimir</button>
  <button onclick="exportarExcel()" style="display:none;" id="btnExcel">📥 Exportar Excel</button>

  <script>
    function calcular() {
      // Inputs básicos
      const producto = document.getElementById('producto').value || 'Producto';
      const costo = parseFloat(document.getElementById('costo').value) || 0;
      const cantidad = parseInt(document.getElementById('cantidad').value) || 1;
      const envioIntl = parseFloat(document.getElementById('envio').value) || 0;
      const precioVenta = parseFloat(document.getElementById('precio').value);

      if (isNaN(precioVenta)) {
        alert('⚠️ Debes ingresar un Precio de venta válido.');
        return;
      }

      // Costos unitarios reales (incluye envío internacional prorrateado)
      const costoTotal = (costo * cantidad) + envioIntl;
      const costoUnitarioReal = cantidad > 0 ? (costoTotal / cantidad) : 0;

      // Comisión ML (se toma directamente del select: 0.08, 0.13, 0.17, etc.)
      const comisionPercent = parseFloat(document.getElementById('publicacion').value) || 0;
      const comisionML = precioVenta * comisionPercent;

      // IVA y retención (Colombia)
      const IVA_RATE = 0.19; // tarifa general (ajusta si tu producto tiene otra tarifa)
      const IVA_RETENTION_RATE = 0.15; // Mercado Libre retiene 15% sobre la porción de IVA
      const ivaIncluded = document.getElementById('iva_included').checked;

      // calcular la porción de IVA según si el precio incluye IVA o no
      let ivaAmount;
      if (ivaIncluded) {
        // porción de IVA contenida en el precio: precio * (iva / (1+iva))
        ivaAmount = precioVenta * (IVA_RATE / (1 + IVA_RATE));
      } else {
        // IVA adicional sobre el precio: precio * iva
        ivaAmount = precioVenta * IVA_RATE;
      }
      const ivaRetenido = ivaAmount * IVA_RETENTION_RATE;

      // Mercado Pago: % + fijo + IVA (según su nota: "3.29% + $800 + IVA", por eso aplicamos IVA sobre la suma de % + fijo)
      const mpPercent = (parseFloat(document.getElementById('mp_percent').value) || 0) / 100;
      const mpFixed = parseFloat(document.getElementById('mp_fixed').value) || 0;
      const mpFeeWithoutIVA = (precioVenta * mpPercent) + mpFixed;
      const mpFeeIVA = mpFeeWithoutIVA * IVA_RATE; // se suma IVA a la comisión de Mercado Pago
      const mpFeeTotal = mpFeeWithoutIVA + mpFeeIVA;

      // Envío local (si el vendedor lo paga)
      const shippingLocal = parseFloat(document.getElementById('shipping_local').value) || 0;
      const sellerPaysShipping = document.getElementById('seller_pays_shipping').checked;
      const shippingCostToSubtract = sellerPaysShipping ? shippingLocal : 0;

      // Ingreso neto final para el vendedor
      const ingresoNeto = precioVenta - comisionML - ivaRetenido - mpFeeTotal - shippingCostToSubtract;

      // Margen neto sobre el costo unitario real
      let margen = 0;
      if (costoUnitarioReal > 0) {
        margen = ((ingresoNeto - costoUnitarioReal) / costoUnitarioReal) * 100;
      } else {
        margen = 0;
      }
      const resultado = margen >= 50 ? "Viable" : "No Viable";
      const clase = margen >= 50 ? "viable" : "no-viable";

      // Mostrar tabla y botones
      document.getElementById('resultado').style.display = 'table';
      document.getElementById('btnPrint').style.display = 'inline-block';
      document.getElementById('btnExcel').style.display = 'inline-block';

      const tbody = document.querySelector("#resultado tbody");
      tbody.innerHTML = `
        <tr>
          <td>${producto}</td>
          <td>${costoUnitarioReal.toFixed(0)}</td>
          <td>${precioVenta.toFixed(0)}</td>
          <td>${comisionML.toFixed(0)}</td>
          <td>${ivaRetenido.toFixed(0)}</td>
          <td>${mpFeeTotal.toFixed(0)}</td>
          <td>${(shippingCostToSubtract ? shippingCostToSubtract.toFixed(0) : 0)}</td>
          <td>${ingresoNeto.toFixed(0)}</td>
          <td>${margen.toFixed(1)}%</td>
          <td class="${clase}">${resultado}</td>
        </tr>
      `;
    }

    function imprimir() {
      window.print();
    }

    function exportarExcel() {
      let table = document.getElementById("resultado");
      let html = table.outerHTML.replace(/ /g, '%20');
      let url = 'data:application/vnd.ms-excel,' + html;
      let link = document.createElement("a");
      link.href = url;
      link.download = 'cotizacion.xls';
      link.click();
    }
  </script>
</body>
</html>
