<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Mercado Libre CO</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f9; }
    h1 { text-align: center; color: #333; font-size: 1.6rem; }
    form, .table-container {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px;
    }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select {
      width: 100%; padding: 10px; margin-top: 4px;
      border: 1px solid #ccc; border-radius: 8px;
      font-size: 1rem;
    }
    button {
      margin-top: 15px; padding: 12px 15px; border: none;
      border-radius: 8px; cursor: pointer; background: #007bff; color: white;
      font-size: 1rem;
    }
    button:hover { background: #0056b3; }

    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #007bff; color: white; }
    .viable { color: green; font-weight: bold; }
    .no-viable { color: red; font-weight: bold; }

    @media (max-width: 768px) {
      body { margin: 15px; }
      h1 { font-size: 1.3rem; }
      form { padding: 15px; }
      input, select, button { font-size: 0.9rem; padding: 8px; }
    }

    @media (max-width: 600px) {
      .table-container {
        overflow-x: auto;
      }
      table { font-size: 0.85rem; }
      th, td { padding: 6px; }
    }
  </style>
</head>
<body>
  <h1>📊 Simulador de Rentabilidad - Mercado Libre CO</h1>

  <form id="simulador">
    <label>Nombre del producto:</label>
    <input type="text" id="producto" required>

    <label>Valor total compra (COP):</label>
    <input type="number" id="costo" required>

    <label>Cantidad comprada:</label>
    <input type="number" id="cantidad" required>

    <label>Envío internacional total (COP):</label>
    <input type="number" id="envio" required>

    <label>Impuestos pagados (COP) (si aplica):</label>
    <input type="number" id="impuestos" value="0">

    <label>Tipo de publicación y comisión (%):</label>
    <select id="publicacion">
      <optgroup label="Clásica">
        <option value="0.08">Clásica (8%)</option>
        <option value="0.10">Clásica (10%)</option>
        <option value="0.13" selected>Clásica (13%)</option>
        <option value="0.16">Clásica (16%)</option>
      </optgroup>
      <optgroup label="Premium">
        <option value="0.125">Premium (12.5%)</option>
        <option value="0.15">Premium (15%)</option>
        <option value="0.17">Premium (17%)</option>
        <option value="0.205">Premium (20.5%)</option>
      </optgroup>
    </select>

    <label>Precio de venta (COP):</label>
    <input type="number" id="precio">

    <label>Link de Aliexpress:</label>
    <input type="url" id="link" placeholder="https://...">

    <button type="button" onclick="calcular()">Calcular</button>
    <button type="button" onclick="nuevaCotizacion()">➕ Otra cotización</button>
  </form>

  <div class="table-container">
    <table id="resultado" style="display:none;">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Costo Unitario Real</th>
          <th>Precio Venta</th>
          <th>Comisión ML</th>
          <th>IVA Retenido</th>
          <th>Envío (si aplica)</th>
          <th>Ingreso Neto</th>
          <th>Margen Neto</th>
          <th>Ganancia x Unidad</th>
          <th>Link Aliexpress</th>
          <th>Resultado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <button onclick="imprimir()" style="display:none;" id="btnPrint">🖨️ Imprimir</button>
  <button onclick="exportarExcel()" style="display:none;" id="btnExcel">📥 Exportar Excel</button>

  <script>
    function calcular() {
      const producto = document.getElementById('producto').value || 'Producto';
      const valorTotalCompra = parseFloat(document.getElementById('costo').value) || 0;
      const cantidad = parseInt(document.getElementById('cantidad').value) || 1;
      const envioIntl = parseFloat(document.getElementById('envio').value) || 0;
      const impuestosPagados = parseFloat(document.getElementById('impuestos').value) || 0;
      const precioVenta = parseFloat(document.getElementById('precio').value);
      const linkAli = document.getElementById('link').value || '';

      if (isNaN(precioVenta)) {
        alert('⚠️ Debes ingresar un Precio de venta válido.');
        return;
      }

      const costoTotal = valorTotalCompra + envioIntl + impuestosPagados;
      const costoUnitarioReal = cantidad > 0 ? (costoTotal / cantidad) : 0;

      const comisionPercent = parseFloat(document.getElementById('publicacion').value) || 0;
      const comisionML = precioVenta * comisionPercent;

      const IVA_RATE = 0.19;
      const IVA_RETENTION_RATE = 0.15;
      const ivaAmount = precioVenta * (IVA_RATE / (1 + IVA_RATE));
      const ivaRetenido = ivaAmount * IVA_RETENTION_RATE;

      let shippingCost = 0;
      if (precioVenta >= 60000) {
        shippingCost = 7000;
      }

      const ingresoNeto = precioVenta - comisionML - ivaRetenido - shippingCost;
      const margen = costoUnitarioReal > 0 ? ((ingresoNeto - costoUnitarioReal) / costoUnitarioReal) * 100 : 0;
      const gananciaUnidad = ingresoNeto - costoUnitarioReal;

      const resultado = margen >= 50 ? "Viable" : "No Viable";
      const clase = margen >= 50 ? "viable" : "no-viable";

      const fmt = n => '$ ' + Math.round(Number(n || 0)).toLocaleString('es-CO');
      const linkHTML = linkAli ? `<a href="${linkAli}" target="_blank">Ver</a>` : '-';

      document.getElementById('resultado').style.display = 'table';
      document.getElementById('btnPrint').style.display = 'inline-block';
      document.getElementById('btnExcel').style.display = 'inline-block';

      const tbody = document.querySelector("#resultado tbody");
      tbody.innerHTML += `
        <tr>
          <td>${producto}</td>
          <td>${fmt(costoUnitarioReal)}</td>
          <td>${fmt(precioVenta)}</td>
          <td>${fmt(comisionML)}</td>
          <td>${fmt(ivaRetenido)}</td>
          <td>${fmt(shippingCost)}</td>
          <td>${fmt(ingresoNeto)}</td>
          <td>${margen.toFixed(1)}%</td>
          <td>${fmt(gananciaUnidad)}</td>
          <td>${linkHTML}</td>
          <td class="${clase}">${resultado}</td>
        </tr>
      `;
    }

    function nuevaCotizacion() {
      const producto = document.getElementById('producto').value; // mantener nombre
      document.getElementById('simulador').reset();
      document.getElementById('producto').value = producto; // restaurar producto
    }

    function imprimir() { window.print(); }

    function exportarExcel() {
      let table = document.getElementById("resultado");
      let html = table.outerHTML.replace(/ /g, '%20');
      let url = 'data:application/vnd.ms-excel,' + html;
      let link = document.createElement("a");
      link.href = url;
      link.download = 'cotizacion.xls';
      link.click();
    }
  </script>
</body>
</html>
